name: CI/CD Pipeline Docker (Production)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy source code
        uses: actions/checkout@v4

      - name: Đăng nhập vào Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build và Push kèm tag theo commit SHA để dễ dàng rollback và tag latest
      # Có sử dụng GitHub Actions cache để tối ưu hóa thời gian build
      - name: Build và Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/204prod-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/204prod-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build và Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/204prod-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/204prod-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-digitalocean:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Lấy source code (để copy file config)
        uses: actions/checkout@v4

      - name: Copy cấu hình (docker-compose, nginx) lên Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Chỉ copy các file cấu hình, file .env đã được lưu sẵn thủ công trên server
          source: "docker-compose.prod.yml,infra/nginx/nginx.prod.conf"
          target: "/var/www/204prod"

      - name: SSH vào Server và Deploy bản mới
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/204prod
            
            # Định nghĩa các biến môi trường cho Docker Compose
            IMAGE_TAG=${{ github.sha }}
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            
            # Kéo các image mới nhất
            IMAGE_TAG=$IMAGE_TAG DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME docker compose -f docker-compose.prod.yml pull
            
            # Khởi động lại hệ thống
            IMAGE_TAG=$IMAGE_TAG DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME docker compose -f docker-compose.prod.yml up -d
            
            # Đợi Database sẵn sàng rồi chạy migrations
            echo "Waiting for database to be ready..."
            for i in {1..30}; do
              if IMAGE_TAG=$IMAGE_TAG DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME docker compose -f docker-compose.prod.yml exec -T backend python -c "import socket; s = socket.socket(); s.connect(('mysql', 3306))" 2>/dev/null; then
                echo "Database is ready!"
                break
              fi
              sleep 1
            done
            
            # Chạy migration database
            IMAGE_TAG=$IMAGE_TAG DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME docker compose -f docker-compose.prod.yml exec -T backend alembic upgrade head
            
            # Dọn dẹp các images cũ
            docker image prune -a -f --filter "until=168h"