events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Cấu hình log
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    # Cấu hình Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # 1. Khối này CHỈ làm nhiệm vụ chuyển hướng HTTP sang HTTPS
    server {
        listen 80;
        server_name 204prod.vn www.204prod.vn;
        
        # Lệnh ép chuyển hướng 100% sang HTTPS
        return 301 https://$host$request_uri;
    }

    # 2. Khối HTTPS (443) sẽ gánh vác toàn bộ công việc thực sự
    server {
        listen 443 ssl;
        server_name 204prod.vn www.204prod.vn;

        ssl_certificate /etc/letsencrypt/live/204prod.vn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/204prod.vn/privkey.pem;

        # Cấu hình bảo mật SSL khuyến nghị
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # 1. API Backend
        location /api {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Uploads/Media files
        location /uploads {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Frontend Production (Served on port 80 inside container)
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
