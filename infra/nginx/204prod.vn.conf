server {
    listen 80;
    server_name 204prod.vn www.204prod.vn; # Thay bằng tên miền của bạn

    # 1. FRONTEND: Phục vụ các file tĩnh đã được build (index.html, JS, CSS)
    # Đường dẫn trỏ tới thư mục dist trên server thực tế của bạn
    root /var/www/204prod/frontend/dist; 
    index index.html;

    location / {
        # Try_files rất quan trọng cho React Router để không bị lỗi 404 khi F5
        try_files $uri $uri/ /index.html;
    }

    # 2. BACKEND API: Forward các request bắt đầu bằng /api về cho FastAPI xử lý
    location /api {
        proxy_pass http://127.0.0.1:8000; # Cổng backend đang chạy trên server
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. UPLOADS / MEDIA
    location /uploads {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
